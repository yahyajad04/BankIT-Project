<svg xmlns="http://www.w3.org/2000/svg" viewBox="260 90 300 400" width="100%" height="100%">
  <!-- Logo Icon Group -->
  <g>
    <!-- Light Blue Shield Outline -->
    <path d="M 290 160 
             L 400 120 
             L 510 160 
             L 510 280 
             C 510 370, 450 430, 400 460 
             C 350 430, 290 370, 290 280 Z"
          fill="none" stroke="rgb(169, 220, 230)" stroke-width="28" stroke-linejoin="round"/>

    <!-- Tech Arrow breaking through the shield -->
    <path d="M 320 340 L 390 270 L 430 310 L 530 210"
          fill="none" stroke="rgb(169, 220, 230)" stroke-width="24" stroke-linejoin="round" stroke-linecap="round"/>
          
    <!-- Arrow Head Pointing Up-Right -->
    <path d="M 470 210 L 530 210 L 530 270"
          fill="none" stroke="rgb(169, 220, 230)" stroke-width="24" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Circuit Nodes (White fill, Light Blue stroke) -->
    <circle cx="320" cy="340" r="14" fill="#FFFFFF" stroke="rgb(169, 220, 230)" stroke-width="8"/>
    <circle cx="390" cy="270" r="14" fill="#FFFFFF" stroke="rgb(169, 220, 230)" stroke-width="8"/>
    <circle cx="430" cy="310" r="14" fill="#FFFFFF" stroke="rgb(169, 220, 230)" stroke-width="8"/>
  </g>
</svg>
